[package]
name = "sentinel-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "sentinel"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"

[dependencies]
sentinel-events = { path = "../sentinel-events" }
sentinel-store = { path = "../sentinel-store" }
sentinel-guard = { path = "../sentinel-guard" }
sentinel-detect = { path = "../sentinel-detect" }
sentineld = { path = "../sentineld" }
anyhow = "1.0.104"
serde_json = "1.0.151"
uuid = "1.20.0"
clap = { version = "4.5.61", features = ["derive"] }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
